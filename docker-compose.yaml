services:
  panel:
    build:
      context: .
      secrets:
        - adonis_plus_token
    image: pidan-panel:local
    ports:
      - "3333:3333"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "3333"
      NODE_ENV: production
      # Both the panel and the docker daemon must see the SAME physical
      # directory at the SAME absolute path, otherwise the MC containers
      # created through docker.sock bind-mount an empty host directory
      # ("Unable to access jarfile ...").
      PIDAN_DATA_DIR: /srv/pidan-panel/data
      DB_DATABASE: /srv/pidan-panel/data/db.sqlite
    volumes:
      # Host path ./data is mounted at the identical path inside the panel,
      # so MC container bind mounts (PIDAN_DATA_DIR/servers/<id>:/data)
      # resolve to real files on the host.
      - ./data:/srv/pidan-panel/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

secrets:
  adonis_plus_token:
    environment: ADONIS_PLUS_TOKEN
