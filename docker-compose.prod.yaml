# Production deployment file: pulls the prebuilt image from GHCR.
# No build, no private registry token needed.
#
# Server quick start:
#   mkdir -p /srv/pidan-panel && cd /srv/pidan-panel
#   curl -fsSLO https://raw.githubusercontent.com/pdnode-team/pidan-panel/main/docker-compose.prod.yaml
#   curl -fsSL -o .env https://raw.githubusercontent.com/pdnode-team/pidan-panel/main/.env.example
#   # edit .env: set APP_KEY (openssl rand -base64 32) and APP_URL
#   mv docker-compose.prod.yaml docker-compose.yaml
#   docker compose up -d && docker compose logs --tail 20
#
# Upgrade later: docker compose pull && docker compose up -d

services:
  panel:
    image: ghcr.io/pdnode-team/pidan-panel:latest
    ports:
      - "127.0.0.1:3333:3333"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "3333"
      NODE_ENV: production
      PIDAN_DATA_DIR: /srv/pidan-panel/data
      DB_DATABASE: /srv/pidan-panel/data/db.sqlite
    volumes:
      - ./data:/srv/pidan-panel/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
